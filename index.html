<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RE POST - Door to Door</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>

        :root {

            --primary-blue: #1a4a8e;

            --primary-orange: #f27405;

            --bg-soft: #f0f4f8;

            --white: #ffffff;

        }



        body {

            font-family: 'Noto Sans Arabic', 'Poppins', sans-serif;

            background-color: var(--bg-soft);

            margin: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            padding: 20px;

        }



        .container {

            background-color: var(--white);

            padding: 40px 30px;

            border-radius: 30px;

            box-shadow: 0 20px 40px rgba(0,0,0,0.1);

            width: 100%;

            max-width: 450px;

            display: flex;

            flex-direction: column;

            align-items: center;

            box-sizing: border-box;

            text-align: center;

        }



        .logo-img {

            width: 150px; 

            height: auto;

            display: block;

            margin: 0 auto 10px auto;

        }



        .brand-name { 

            font-size: 38px; 

            font-weight: 900; 

            color: var(--primary-blue); 

            margin: 0;

            line-height: 1.2;

        }



        .brand-tagline { 

            color: var(--primary-orange); 

            font-size: 13px; 

            margin-top: 5px; 

            font-weight: 800; 

            letter-spacing: 2px;

            margin-bottom: 30px;

        }



        .form-group { 

            width: 100%; 

            margin-bottom: 18px; 

            text-align: right;

        }



        label { 

            display: block; 

            margin-bottom: 8px; 

            font-weight: 700; 

            color: var(--primary-blue); 

            font-size: 14px;

        }

        

        input, select { 

            width: 100%; 

            padding: 14px; 

            border: 2px solid #eef2f6; 

            border-radius: 12px; 

            box-sizing: border-box; 

            font-size: 15px;

            text-align: right;

            font-family: inherit;

            background-color: #fdfdfd;

            transition: 0.3s;

        }



        input:focus {

            border-color: var(--primary-blue);

            outline: none;

            background-color: #fff;

        }



        button {

            background: linear-gradient(45deg, #25d366, #128c7e);

            color: white; 

            border: none; 

            padding: 18px; 

            width: 100%; 

            border-radius: 15px; 

            font-size: 18px; 

            font-weight: bold; 

            cursor: pointer; 

            margin-top: 15px;

            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);

            transition: 0.3s;

            font-family: inherit;

        }



        button:active {

            transform: scale(0.97);

        }

    </style>

</head>

<body>



<div class="container">

    <img src="photo.png" alt="RE POST" class="logo-img">

    <h1 class="brand-name">RE POST</h1>

    <p class="brand-tagline">DOOR TO DOOR</p>



    <form id="orderForm" style="width: 100%;">

        <div class="form-group">

            <label>ناڤێ کڕیاری / Customer Name:</label>

            <input type="text" id="name" placeholder="Full Name / ناڤێ تە یێ تەمام" required>

        </div>



        <div class="form-group">

            <label>ژمارا مۆبایلێ / Phone Number:</label>

            <input type="tel" id="phone" placeholder="07XXXXXXXXX" required>

        </div>



        <div class="form-group">

            <label>باژێر / City:</label>

            <select id="city" required>

                <option value="">Select City / باژێری هەلبژێره...</option>

                <option value="Duhok">دهۆک / Duhok</option>

                <option value="Zakho">زاخۆ / Zakho</option>

                <option value="Akre">ئاکرێ / Akre</option>

                <option value="Erbil">هەولێر / Erbil</option>

                <option value="Other">باژێرەکێ دی / Other</option>

            </select>

        </div>



        <div class="form-group">

            <label>ناڤونیشان / Address:</label>

            <input type="text" id="address" placeholder="Neighborhood / گەڕەک یان جهەکێ نێزیک" required>

        </div>



        <div class="form-group">

            <label>جۆرێ کالايی / Item Type:</label>

            <input type="text" id="item" placeholder="Ex: Clothes, Shoes... / جلک، پێلاڤ..." required>

        </div>



        <button type="button" onclick="sendToWhatsApp()">بڕێکا وەتسئاپێ داخوازبكه / Send via WhatsApp</button>

    </form>

</div>



<script>

    function sendToWhatsApp() {

        const myWhatsAppNumber = "9647509538524"; 

        const name = document.getElementById('name').value;

        const phone = document.getElementById('phone').value;

        const city = document.getElementById('city').value;

        const address = document.getElementById('address').value;

        const item = document.getElementById('item').value;



        if(name && phone && city && address && item) {

            const message = `📦 *RE POST - NEW ORDER*%0A%0A👤 *Name/ناڤ:* ${name}%0A📞 *Phone/مۆبایل:* ${phone}%0A🏙️ *City/باژێر:* ${city}%0A📍 *Address/ناڤونیشان:* ${address}%0A🛍️ *Item/کالا:* ${item}`;

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${message}`, '_blank');

        } else {

            alert("تکایە هەمی خانەیان تژی بکە! / Please fill all fields!");

        }

    }

</script>



</body>

</html>
